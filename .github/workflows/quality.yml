name: Quality

# Keep the repository gate identical to the command contributors run locally.
# The workflow installs only ShellCheck; all payload Python remains stdlib-only.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-checks:
    # Ubuntu provides GNU tar/gzip used by the reproducibility assertion and
    # permits the loopback-only HTTP/WebSocket integration fixture.
    runs-on: ubuntu-latest
    steps:
      # Pin the major official action; repository contents are read-only here.
      - uses: actions/checkout@v4
      - name: Install host gate dependencies
        # scripts/check.sh needs shellcheck, rg, curl and nc on the host (payload
        # Python remains standard-library-only). ubuntu-latest currently ships
        # the last three, but relying on that is fragile: a missing nc surfaces
        # only as "FAIL: loopback classifier probe failed", which reads as a
        # classifier defect rather than absent tooling. Name them explicitly so
        # an image change fails at install time with an obvious cause.
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck ripgrep netcat-openbsd curl
      - name: Run quality gate
        # Keep CI and contributor/release validation on one maintained command.
        run: scripts/check.sh
